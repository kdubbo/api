syntax = "proto3";

// $schema: dubbo.security.v1alpha3.AuthorizationPolicy
// $title: AuthorizationPolicy
// $description: Authorization policy configuration for workloads.

package dubbo.security.v1alpha3;

import "type/v1alpha3/selector.proto";

option go_package = "/api/security/v1alpha3";

// AuthorizationPolicy defines request authorization policies.
//
// <!-- crd generation tags
// +cue-gen:AuthorizationPolicy:groupName:security.dubbo.apache.org
// +cue-gen:AuthorizationPolicy:versions:v1alpha3
// +cue-gen:AuthorizationPolicy:storageVersion
