// +cue-gen:AuthorizationPolicy:resource:categories=dubbo,security,shortNames=ap,plural=authorizationpolicies,singular=authorizationpolicy
// +cue-gen:AuthorizationPolicy:preserveUnknownFields:false
// +cue-gen:AuthorizationPolicy:printerColumn:name=Action,type=string,JSONPath=.spec.action,description="The authorization action."
// +cue-gen:AuthorizationPolicy:printerColumn:name=Age,type=date,JSONPath=.metadata.creationTimestamp,description="CreationTimestamp is a timestamp
// representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations.
// Clients may not set this value. It is represented in RFC3339 form and is in UTC.
// Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata"
// -->
//
// <!-- go code generation tags
// +kubetype-gen
// +kubetype-gen:groupVersion=security.dubbo.apache.org/v1alpha3
// +genclient
// +k8s:deepcopy-gen=true
// -->
message AuthorizationPolicy {
  enum Action {
    // Allow requests that match any rule.
    ALLOW = 0;
    // Deny requests that match any rule.
    DENY = 1;
    // Audit matching requests without enforcing the decision.
    AUDIT = 2;
    // Delegate matching requests to an external authorization provider.
    CUSTOM = 3;
  }

  // The selector determines the workloads to apply the authorization policy on.
  // If not set, the policy applies to all workloads in the same namespace.
  dubbo.type.v1alpha3.WorkloadSelector selector = 1;

  // The action to take if a request matches the rules.
  Action action = 2;

  // Authorization rules. For ALLOW policies, no matching rule means the request
  // is denied.
  repeated Rule rules = 3;

  // External authorization provider used by CUSTOM policies.
  ExtensionProvider provider = 4;

  // Evaluate and report this policy without enforcing its result.
  bool dry_run = 5;
}

message Rule {
  // Sources of a request.
  repeated From from = 1;

  // Request operations.
  repeated To to = 3;

  // Additional conditions that must match.
  repeated Condition when = 2;
}

message From {
  // Source attributes.
  Source source = 1;
}

message Source {
  // Peer identities derived from mutual TLS.
  repeated string principals = 2;

  // Peer identities excluded from this source.
  repeated string not_principals = 3;

  // Request identities derived from validated JWT issuer and subject.
  repeated string request_principals = 1;

  // JWT request identities excluded from this source.
  repeated string not_request_principals = 4;

  // Source workload namespaces.
  repeated string namespaces = 5;

  // Source workload namespaces excluded from this source.
  repeated string not_namespaces = 6;

  // Source workload service accounts in namespace/service-account form.
  repeated string service_accounts = 7;

  // Source workload service accounts excluded from this source.
  repeated string not_service_accounts = 8;

  // Source IP blocks observed on the immediate downstream connection.
  repeated string ip_blocks = 9;

  // Immediate source IP blocks excluded from this source.
  repeated string not_ip_blocks = 10;

  // Original client IP blocks derived from trusted proxy headers.
  repeated string remote_ip_blocks = 11;

  // Original client IP blocks excluded from this source.
  repeated string not_remote_ip_blocks = 12;
}

message To {
  // Operation attributes.
  Operation operation = 1;
}

message Operation {
  // HTTP hosts.
  repeated string hosts = 1;

  // HTTP hosts excluded from this operation.
  repeated string not_hosts = 2;

  // Destination ports. Values use decimal string form.
  repeated string ports = 3;

  // Destination ports excluded from this operation.
  repeated string not_ports = 4;

  // HTTP methods.
  repeated string methods = 5;

  // HTTP methods excluded from this operation.
  repeated string not_methods = 6;

  // HTTP paths. A trailing '*' performs prefix matching.
  repeated string paths = 7;

  // HTTP paths excluded from this operation.
  repeated string not_paths = 8;
}

message Condition {
  // Attribute key. For JWT claims, use request.auth.claims[claim-name].
  string key = 1;

  // Allowed values.
  repeated string values = 2;

  // Disallowed values.
  repeated string not_values = 3;
}

message ExtensionProvider {
  // Name of the configured external authorization provider.
  string name = 1;
}
