// +cue-gen:AuthorizationPolicy:preserveUnknownFields:false
// +cue-gen:AuthorizationPolicy:printerColumn:name=Action,type=string,JSONPath=.spec.action,description="The authorization action."
// +cue-gen:AuthorizationPolicy:printerColumn:name=Age,type=date,JSONPath=.metadata.creationTimestamp,description="CreationTimestamp is a timestamp
// representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations.
// Clients may not set this value. It is represented in RFC3339 form and is in UTC.
// Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata"
// -->
//
// <!-- go code generation tags
// +kubetype-gen
// +kubetype-gen:groupVersion=security.dubbo.apache.org/v1alpha3
// +genclient
// +k8s:deepcopy-gen=true
// -->
message AuthorizationPolicy {
  enum Action {
    // Allow requests that match any rule.
    ALLOW = 0;
    // Deny requests that match any rule.
    DENY = 1;
  }

  // The selector determines the workloads to apply the authorization policy on.
  // If not set, the policy applies to all workloads in the same namespace.
  dubbo.type.v1alpha3.WorkloadSelector selector = 1;

  // The action to take if a request matches the rules.
  Action action = 2;

  // Authorization rules. For ALLOW policies, no matching rule means the request
  // is denied.
  repeated Rule rules = 3;
}

message Rule {
  // Sources of a request.
  repeated From from = 1;

  // Additional conditions that must match.
  repeated Condition when = 2;
}

message From {
  // Source attributes.
  Source source = 1;
}

message Source {
  // Request identities derived from validated JWT issuer and subject.
  repeated string request_principals = 1;

  // Workload identities derived from a verified mutual TLS certificate.
  repeated string principals = 2;
}

message Condition {
  // Attribute key. For JWT claims, use request.auth.claims[claim-name].
  string key = 1;

  // Allowed values.
  repeated string values = 2;

  // Disallowed values.
  repeated string not_values = 3;
}
