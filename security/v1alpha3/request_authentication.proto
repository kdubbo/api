syntax = "proto3";

// $schema: dubbo.security.v1alpha3.RequestAuthentication
// $title: RequestAuthentication
// $description: Request authentication configuration for workloads.

package dubbo.security.v1alpha3;

import "type/v1alpha3/selector.proto";

option go_package = "/api/security/v1alpha3";

// RequestAuthentication defines request-level authentication policies.
//
// <!-- crd generation tags
