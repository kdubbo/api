message RequestAuthentication {
  // The selector determines the workloads to apply the request authentication on.
  // If not set, the policy applies to all workloads in the same namespace.
  dubbo.type.v1alpha3.WorkloadSelector selector = 1;

  // Rules to validate JWT tokens found in the request.
  repeated JWTRule jwt_rules = 2;
}

message JWTRule {
  // Identifies the issuer that issued the JWT.
  string issuer = 1;

  // Audiences accepted by this rule. If empty, audience is not checked.
  repeated string audiences = 2;

  // URL of the JSON Web Key Set used to validate tokens.
  string jwks_uri = 3;

  // Inline JSON Web Key Set. If both jwks and jwksUri are set, jwks takes precedence.
  string jwks = 4;

  // JWT locations in request headers. If empty, Authorization: Bearer is used.
  repeated JWTHeader from_headers = 5;

  // JWT locations in query parameters.
  repeated string from_params = 6;
}

message JWTHeader {
  // Header name.
  string name = 1;

  // Optional prefix stripped before JWT validation.
  string prefix = 2;
}
