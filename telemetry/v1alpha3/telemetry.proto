syntax = "proto3";

// $schema: dubbo.telemetry.v1alpha3.Telemetry
// $title: Telemetry
// $description: Telemetry configuration for Inherent workloads.

package dubbo.telemetry.v1alpha3;

import "google/protobuf/wrappers.proto";
import "type/v1alpha3/selector.proto";

option go_package = "github.com/kdubbo/api/telemetry/v1alpha3";

// Telemetry defines how telemetry is generated for workloads within a mesh.
//
// Telemetry is resolved from least to most specific. Fields explicitly set at
// a lower level replace the corresponding field from the parent level:
//
// 1. Mesh-level configuration (one `Telemetry` resource without a `selector`
//    in `dubbo-system`)
// 2. Namespace-level configuration (one `Telemetry` resource without a
//    `selector` in the workload namespace)
// 3. Workload-level configuration (a `Telemetry` resource with a matching
//    `selector` in the workload namespace)
//
// <!-- crd generation tags
// +cue-gen:Telemetry:groupName:telemetry.dubbo.apache.org
// +cue-gen:Telemetry:versions:v1alpha3
// +cue-gen:Telemetry:storageVersion
// +cue-gen:Telemetry:annotations:helm.sh/resource-policy=keep
// +cue-gen:Telemetry:labels:app=dubbo,chart=dubbo,dubbo=telemetry,heritage=Tiller,release=dubbo
// +cue-gen:Telemetry:subresource:status
// +cue-gen:Telemetry:scope:Namespaced
// +cue-gen:Telemetry:resource:categories=dubbo,telemetry,plural=telemetries,shortNames=telemetry
// +cue-gen:Telemetry:preserveUnknownFields:false
// +cue-gen:Telemetry:printerColumn:name=Age,type=date,JSONPath=.metadata.creationTimestamp,description="CreationTimestamp is a timestamp
// representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations.
// Clients may not set this value. It is represented in RFC3339 form and is in UTC.
// Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata"
// -->
//
// <!-- go code generation tags
// +kubetype-gen
// +kubetype-gen:groupVersion=telemetry.dubbo.apache.org/v1alpha3
// +genclient
// +k8s:deepcopy-gen=true
// -->
message Telemetry {
  // The selector determines the workloads to apply the Telemetry on.
  dubbo.type.v1alpha3.WorkloadSelector selector = 1;

  // Tracing configures tracing behavior for selected workloads.
  repeated Tracing tracing = 2;

  // Metrics configures metric generation for selected workloads.
  repeated Metrics metrics = 3;
}

// Metrics configures metric generation for selected workloads.
message Metrics {
  // MetricsProvider selects a metrics provider by name.
  message MetricsProvider {
    // REQUIRED. `prometheus` enables Prometheus metrics.
    string name = 1;
  }

  // Providers used for metric reporting.
  repeated MetricsProvider providers = 1;

  // Controls metric generation. When omitted, a configured provider enables
  // metrics. False disables metrics for selected workloads.
  google.protobuf.BoolValue enabled = 2;

  // Rules customize standard metrics. A non-empty list replaces rules
  // inherited from the parent Telemetry level.
  repeated MetricRule rules = 3;
}

// StandardMetric identifies a metric generated by the Inherent data plane.
enum StandardMetric {
  STANDARD_METRIC_UNSPECIFIED = 0;

  // Number of completed RPC requests.
  REQUEST_COUNT = 1;
}

// MetricScope selects which side of an Inherent RPC applies a rule.
enum MetricScope {
  METRIC_SCOPE_UNSPECIFIED = 0;
  CLIENT = 1;
  SERVER = 2;
  CLIENT_AND_SERVER = 3;
}

// MetricRule customizes one standard metric.
message MetricRule {
  // REQUIRED. Standard metric selected by this rule.
  StandardMetric metric = 1;

  // REQUIRED. Inherent reporter side selected by this rule.
  MetricScope scope = 2;

  // Tag overrides keyed by metric tag name.
  map<string, TagOverride> tags = 3;
}

// TagOverride changes one standard metric tag.
message TagOverride {
  enum Action {
    ACTION_UNSPECIFIED = 0;

    // Remove the tag from the generated metric.
    REMOVE = 1;
  }

  // REQUIRED. Operation applied to the tag.
  Action action = 1;
}

// Tracing configures tracing behavior for selected workloads.
message Tracing {
  message TracingProvider {
    // REQUIRED. Name of the tracing provider.
    string name = 1;
  }

  message Tag {
    // REQUIRED. Span attribute name.
    string name = 1;

    // Span attribute value.
    string value = 2;
  }

  // Providers used for span reporting.
  repeated TracingProvider providers = 1;

  // Sampling percentage in range [0.0, 100.0].
  google.protobuf.DoubleValue random_sampling_percentage = 2;

  // Disables span reporting for selected workloads.
  google.protobuf.BoolValue disable_span_reporting = 3;

  // Static span tags.
  repeated Tag tags = 4;
}
