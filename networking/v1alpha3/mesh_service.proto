syntax = "proto3";

// $schema: dubbo.networking.v1alpha3.MeshService
// $title: Mesh Service
// $description: Service-to-service routing and traffic policy.

package dubbo.networking.v1alpha3;

import "google/api/field_behavior.proto";
import "networking/v1alpha3/destination_rule.proto";
import "networking/v1alpha3/virtual_service.proto";

option go_package = "/api/networking/v1alpha3";

// MeshService combines route rules and traffic policies for service-to-service traffic.
//
// <!-- crd generation tags
// +cue-gen:MeshService:groupName:networking.dubbo.apache.org
// +cue-gen:MeshService:versions:v1alpha3
// +cue-gen:MeshService:annotations:helm.sh/resource-policy=keep
// +cue-gen:MeshService:labels:app=dubbo,chart=dubbo,heritage=Tiller,release=dubbo
// +cue-gen:MeshService:subresource:status
// +cue-gen:MeshService:scope:Namespaced
// +cue-gen:MeshService:resource:categories=dubbo,networking,shortNames=ms
// +cue-gen:MeshService:printerColumn:name=Hosts,type=string,JSONPath=.spec.hosts,description="The destination hosts to which service traffic is being sent"
// +cue-gen:MeshService:printerColumn:name=Age,type=date,JSONPath=.metadata.creationTimestamp,description="CreationTimestamp is a timestamp
// representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations.
// Clients may not set this value. It is represented in RFC3339 form and is in UTC.
// Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata"
// +cue-gen:MeshService:preserveUnknownFields:false
// -->
//
// <!-- go code generation tags
// +kubetype-gen
// +kubetype-gen:groupVersion=networking.dubbo.apache.org/v1alpha3
// +genclient
// +k8s:deepcopy-gen=true
// -->
message MeshService {
  // Hosts addressed by this service-to-service policy.
  repeated string hosts = 1;

  // Ordered routing rules. Place exact rules first, broad rules next, and fallback routes last.
  repeated MeshServiceRule rules = 3;

  // Ordered fallback route entries. This field keeps older service-weight routing manifests working.
  repeated MeshServiceRoute routes = 4;

  // Default traffic policy for every destination in this MeshService.
  TrafficPolicy traffic_policy = 5;
}

message MeshServiceRule {
  // Match conditions for the primary route entries.
  repeated HTTPMatchRequest match = 1;

  // Primary route entries used when match conditions are satisfied.
  repeated MeshServiceRoute route = 2;

  // Fallback route entries used after primary match-specific routes.
  repeated MeshServiceRoute routes = 3;
}

message MeshServiceRoute {
  // One route entry can split traffic across multiple service destinations.
  repeated ServiceDestination service = 1;
}

message ServiceDestination {
  // Name is the target Kubernetes Service for service-based traffic splitting. When labels are set, name is used as the subset name.
  string name = 1;
  // Host is the host addressed by this route policy. Label-based destinations use host plus labels; service-based destinations resolve name to the target Service host.
  string host = 2 [(google.api.field_behavior) = REQUIRED];
  ServicePort port = 3;
  // Labels select a subset of endpoints behind host. If labels are empty, traffic is split by service name instead of endpoint labels.
  map<string, string> labels = 4;
  int32 weight = 5;
  TrafficPolicy traffic_policy = 6;
}

message ServicePort {
  uint32 number = 1;
  string name = 2;
}
