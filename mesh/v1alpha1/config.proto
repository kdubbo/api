syntax = "proto3";

package dubbo.mesh.v1alpha1;

import "google/protobuf/duration.proto";
import "proxy.proto";

option go_package = "/api/mesh/v1alpha1";

// MeshConfig defines mesh-wide runtime settings for the Dubbo service mesh.
message MeshConfig {
  google.protobuf.Duration connect_timeout = 1;

  ProxyConfig default_config = 2;

  repeated ConfigSource config_sources = 3;

  string trust_domain = 4;

  repeated string trust_domain_aliases = 5;

  message CertificateData {
    oneof certificate_data {
      string pem = 1;
      string spiffe_bundle_url = 2;
    }
    repeated string cert_signers = 3;

    repeated string trust_domains = 4;
  }

  repeated CertificateData ca_certificates = 6;

  repeated string default_service_export_to = 7;

  // Legacy Istio-style traffic resources were removed in favor of Gateway API.
  reserved 8, 9;

  string root_namespace = 10;

  google.protobuf.Duration dns_refresh_rate = 11;

  repeated Certificate certificates = 12 [deprecated = true];

  // Observability is configured exclusively through the Telemetry API.
  reserved 13 to 15;

  // Mesh-wide mutual TLS defaults.
  MeshMTLS mesh_mtls = 16;

  // Named extension providers referenced by security policies.
  repeated MeshExtensionProvider extension_providers = 17;
}

message MeshMTLS {
  enum TLSProtocol {
    // Use the implementation default, currently TLS 1.2.
    TLS_AUTO = 0;
    // Require TLS 1.2 or newer.
    TLSV1_2 = 1;
    // Require TLS 1.3.
    TLSV1_3 = 2;
  }

  // Minimum protocol version accepted for mesh mutual TLS.
  TLSProtocol min_protocol_version = 1;
}

message MeshExtensionProvider {
  // Unique provider name referenced by AuthorizationPolicy.provider.name.
  string name = 1;

  oneof provider {
    // HTTP external authorization service.
    ExternalAuthorizationProvider envoy_ext_authz_http = 2;

    // gRPC external authorization service.
    ExternalAuthorizationProvider envoy_ext_authz_grpc = 3;
  }
}

message ExternalAuthorizationProvider {
  // Kubernetes service host or DNS name.
  string service = 1;

  // Service port.
  uint32 port = 2;

  // HTTP path prefix prepended to authorization checks.
  string path_prefix = 3;

  // Request headers sent to the authorization service.
  repeated string include_request_headers_in_check = 4;

  // Authorization response headers forwarded to the upstream workload.
  repeated string headers_to_upstream_on_allow = 5;

  // Authorization response headers forwarded to the downstream client on deny.
  repeated string headers_to_downstream_on_deny = 6;

  // Authorization check timeout.
  google.protobuf.Duration timeout = 7;

  // Permit requests when the authorization service is unavailable.
  bool fail_open = 8;
}

message LabelSelector {
  // +optional
  map<string, string> matchLabels = 1;

  // +optional
  repeated LabelSelectorRequirement matchExpressions = 2;
}

message LabelSelectorRequirement {
  // +patchMergeKey=key
  // +patchStrategy=merge
  string key = 1;

  string operator = 2;

  // +optional
  repeated string values = 3;
}

message ConfigSource {
  string address = 1;
  // TLS settings removed - not needed for Inherent mesh
  // dubbo.networking.v1alpha3.ClientTLSSettings tls_settings = 2;
}

message Certificate {
  string secret_name = 1;
  repeated string dns_names = 2;
}
