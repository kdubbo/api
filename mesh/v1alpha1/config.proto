syntax = "proto3";

package dubbo.mesh.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "proxy.proto";

option go_package = "/api/mesh/v1alpha1";

// MeshConfig defines mesh-wide runtime settings for the Dubbo service mesh.
message MeshConfig {
  google.protobuf.Duration connect_timeout = 1;

  ProxyConfig default_config = 2;

  repeated ConfigSource config_sources = 3;

  string trust_domain = 4;

  repeated string trust_domain_aliases = 5;

  message CertificateData {
    oneof certificate_data {
      string pem = 1;
      string spiffe_bundle_url = 2;
    }
    repeated string cert_signers = 3;

    repeated string trust_domains = 4;
  }

  repeated CertificateData ca_certificates = 6;

  repeated string default_service_export_to = 7;

  repeated string default_virtual_service_export_to = 8;

  repeated string default_destination_rule_export_to = 9;

  string root_namespace = 10;

  google.protobuf.Duration dns_refresh_rate = 11;

  repeated Certificate certificates = 12 [deprecated = true];

  // Flag to control generation of trace spans and request IDs.
  // When enabled, workloads and managed gateways report spans to the default
  // tracing extension provider.
  bool enable_tracing = 13;

  message ExtensionProvider {
    // REQUIRED. A unique name identifying the extension provider.
    string name = 1;

    oneof provider {
      // Configures an OpenTelemetry tracing provider (OTLP over gRPC).
      OpenTelemetryTracingProvider opentelemetry = 2;
    }
  }

  message OpenTelemetryTracingProvider {
    // REQUIRED. Hostname of the service that implements the OTLP collector,
    // e.g. "jaeger-collector.dubbo-system.svc.cluster.local".
    string service = 1;

    // REQUIRED. Port of the OTLP gRPC collector, typically 4317.
    uint32 port = 2;
  }

  // Defines a list of extension providers available for use in the mesh.
  // A provider is activated mesh-wide through enable_tracing together with
  // default_providers, or used directly by name.
  repeated ExtensionProvider extension_providers = 14;

  message DefaultProviders {
    // Names of the default tracing providers. When empty and tracing is
    // enabled, the first provider that configures tracing is used.
    repeated string tracing = 1;
  }

  // Specifies extension providers to use by default.
  DefaultProviders default_providers = 15;
}

message LabelSelector {
  // +optional
  map<string, string> matchLabels = 1;

  // +optional
  repeated LabelSelectorRequirement matchExpressions = 2;
}

message LabelSelectorRequirement {
  // +patchMergeKey=key
  // +patchStrategy=merge
  string key = 1;

  string operator = 2;

  // +optional
  repeated string values = 3;
}

message ConfigSource {
  string address = 1;
  // TLS settings removed - not needed for proxyless mesh
  // dubbo.networking.v1alpha3.ClientTLSSettings tls_settings = 2;
}

message Certificate {
  string secret_name = 1;
  repeated string dns_names = 2;
}
